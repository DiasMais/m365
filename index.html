let userName="", userArea="", currentModule=-1, progress={}, quizState={};

function getInitials(n){return n.split(" ").slice(0,2).map(x=>x[0]?.toUpperCase()||"").join("");}

function startPlatform(){
  const n=document.getElementById("nameInput").value.trim();
  const a=document.getElementById("areaInput").value.trim();
  if(!n){document.getElementById("nameInput").style.borderColor="#C47A77";return;}
  userName=n; userArea=a||"Colaborador";
  const key="diasM365_"+n.toLowerCase().replace(/\s+/g,"_");
  try{const s=localStorage.getItem(key);if(s)progress=JSON.parse(s);}catch(e){progress={};}
  document.getElementById("userModal").style.display="none";
  document.getElementById("mainHeader").style.display="flex";
  document.getElementById("mainLayout").style.display="flex";
  document.getElementById("userBadge").textContent=getInitials(n);
  renderNav();updateProgress();showWelcome();
  sendLoginToSheet(userName, userArea);
  // URL already configured
}

function saveProgress(){
  try{localStorage.setItem("diasM365_"+userName.toLowerCase().replace(/\s+/g,"_"),JSON.stringify(progress));}catch(e){}
}

function updateProgress(){
  const done=Object.keys(progress).filter(k=>progress[k]).length;
  const pct=Math.round(done/MODULES.length*100);
  document.getElementById("progressText").textContent=done+" de "+MODULES.length+" concluídos";
  document.getElementById("progressBarFill").style.width=pct+"%";
  document.getElementById("progressPct").textContent=pct+"%";
}

function renderNav(){
  document.getElementById("moduleNav").innerHTML=MODULES.map(m=>`
    <div class="module-nav-item ${currentModule===m.id?"active":""} ${progress[m.id]?"completed":""}" onclick="showModule(${m.id})">
      <div class="module-nav-num">${progress[m.id]?"✓":m.id}</div>
      <div class="module-nav-text">
        <div class="module-nav-label">${m.titleHighlight}</div>
        <div class="module-nav-tag">${m.tag}</div>
      </div>
      <div class="quiz-badge">Q</div>
    </div>`).join("");
}

function showWelcome(){
  currentModule=-1;renderNav();
  const done=Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById("contentArea").innerHTML=`
    <div class="welcome-screen">
      <div class="welcome-logo"><img src="${LOGO_WHITE}" alt="Dias+"></div>
      <div class="welcome-sub">Trilha de Aprendizado · Microsoft 365</div>
      <div class="welcome-desc">
        Olá, <strong>${userName}</strong>! Seja bem-vindo(a) à trilha oficial de capacitação M365 da Dias+.<br>
        Avance no seu ritmo — seu progresso é salvo automaticamente.
        ${done>0?"<br><br><span style=\"color:#2DC5B4;font-weight:600\">✓ Você já completou "+done+" de "+MODULES.length+" módulos.</span>":""}
      </div>
      <div class="modules-grid">
        ${MODULES.map(m=>`
          <div class="module-card-mini" onclick="showModule(${m.id})">
            <div class="module-card-icon">${progress[m.id]?"✅":m.icon}</div>
            <div class="module-card-num">${m.tag}</div>
            <div class="module-card-name">${m.titleHighlight}</div>
          </div>`).join("")}
      </div>
      <button class="btn-start" onclick="showModule(${done<MODULES.length?done:0})">
        ${done===0?"Começar trilha →":done===MODULES.length?"Revisar trilha →":"Continuar trilha →"}
      </button>
    </div>`;
}

function buildBenefitGrid(benefits){
  return `<div class="benefit-grid">${benefits.map(b=>`
    <div class="benefit-item">
      <div class="benefit-icon">${b.icon}</div>
      <div class="benefit-text"><strong>${b.title}</strong><span>${b.desc}</span></div>
    </div>`).join("")}</div>`;
}

  currentModule=id;
  if(!quizState[id])quizState[id]={answers:{},submitted:false};
  renderNav();
  const m=MODULES[id], qs=quizState[id];
  const area=document.getElementById("contentArea");
  area.scrollTop=0;

  const allAnswered=m.quiz.every((_,i)=>qs.answers[i]!==undefined);

  const introHtml=`

      <h3>${m.intro.heading}</h3>

        </div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.85)">${m.videoLabel}</div>

  const quizQs=m.quiz.map((q,qi)=>`
    <div style="margin-bottom:${qi<m.quiz.length-1?20:0}px">
      <div class="quiz-q-num">QUESTÃO ${qi+1} DE ${m.quiz.length}</div>
      <div class="quiz-q-text">${q.q}</div>
      <div class="quiz-options">
        ${q.options.map((opt,oi)=>`
          <button class="quiz-option ${getOptionClass(id,qi,oi)}" 
            ${qs.submitted?"disabled":""} 
            onclick="selectOption(${id},${qi},${oi})">${opt}</button>`).join("")}
      </div>
      <div class="quiz-feedback ${qs.submitted?(qs.answers[qi]===q.correct?"show ok":"show nok"):""}">
        ${qs.submitted?(qs.answers[qi]===q.correct?"✓ ":"✗ A resposta correta é: <strong>"+q.options[q.correct]+"</strong>. ")+q.feedback:""}
      </div>
    </div>
    ${qi<m.quiz.length-1?"<div class=\"quiz-divider\"></div>":""}`).join("");

  const quizAction=!qs.submitted?`
    <div style="text-align:center;margin-top:20px">
      <button class="btn-complete" 
        style="background:${allAnswered?"#2DC5B4":"rgba(255,255,255,0.08)"};color:${allAnswered?"#0B3040":"rgba(255,255,255,0.25)"};cursor:${allAnswered?"pointer":"default"}"
        ${allAnswered?`onclick="submitQuiz(${id})"`:""}>Verificar respostas</button>
      ${!allAnswered?"<div style=\"font-size:12px;color:rgba(255,255,255,0.3);margin-top:8px\">Responda todas as perguntas para continuar</div>":""}
    </div>`
    :`<div class="quiz-result show">${renderResult(id,m)}</div>`;

  area.innerHTML=`
    ${progress[id]?"<div class=\"completed-banner\"><div style=\"font-size:20px\">✅</div><div class=\"completed-text\">Você já concluiu este módulo! Pode revisá-lo à vontade.</div></div>":""}
    <div class="content-header">
      <div class="module-tag">${m.tag} · ${userArea}</div>
      <div class="content-title">${m.title}<br><span>${m.titleHighlight}</span></div>
      <div class="content-subtitle">${m.subtitle}</div>
    </div>
    ${introHtml}
    ${videoHtml}
    <div class="steps-card">
      <h3>Passo a Passo</h3>
      <ul class="steps-list">
        ${m.steps.map((s,i)=>`<li><div class="step-num">${i+1}</div><span>${s}</span></li>`).join("")}
      </ul>
    </div>
    ${govHtml}
    <div class="quiz-section">
      <div class="quiz-header">
        <div class="quiz-icon">📝</div>
        <div class="quiz-title">Quiz Rápido</div>
      </div>
      ${quizQs}
      ${quizAction}
    </div>`;
}

function getOptionClass(id,qi,oi){
  const qs=quizState[id];
  if(!qs||!qs.submitted)return(qs&&qs.answers[qi]===oi)?"selected":"";
  const c=MODULES[id].quiz[qi].correct;
  if(oi===c)return"correct";
  if(qs.answers[qi]===oi&&oi!==c)return"selected-wrong";
  return"wrong";
}

function selectOption(id,qi,oi){
  if(quizState[id].submitted)return;
  quizState[id].answers[qi]=oi;
  showModule(id);
  document.getElementById("contentArea").scrollTop=document.getElementById("contentArea").scrollHeight;
}

function submitQuiz(id){
  quizState[id].submitted=true;
  const m=MODULES[id];
  const score=m.quiz.filter((q,i)=>quizState[id].answers[i]===q.correct).length;
  progress[id]=true;
  saveProgress();updateProgress();
  sendProgressToSheet({
    name: userName,
    area: userArea,
    moduleId: id,
    moduleName: m.titleHighlight,
    score: score,
    total: m.quiz.length,
    completed: true
  });
  showModule(id);
  setTimeout(()=>{document.getElementById("contentArea").scrollTop=document.getElementById("contentArea").scrollHeight;},100);
}

function renderResult(id,m){
  const qs=quizState[id];
  const score=m.quiz.filter((q,i)=>qs.answers[i]===q.correct).length;
  const ok=score===m.quiz.length;
  const next=id+1, hasNext=next<MODULES.length;
  return`
    <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:4px;letter-spacing:2px;text-transform:uppercase">Resultado</div>
    <div class="quiz-result-score" style="color:${ok?"#2DC5B4":"#e8a0a0"}">${score}/${m.quiz.length}</div>
    <div class="quiz-result-msg">${ok?"🎉 Parabéns! Módulo concluído.":"Você errou algumas questões — mas pode continuar! As respostas corretas estão destacadas acima."}</div>
    ${hasNext?`<button class="btn-complete" onclick="showModule(${next})" style="margin-top:16px">Próximo: ${MODULES[next].titleHighlight} →</button>`:""}
    ${!hasNext?`<button class="btn-complete" onclick="showWelcome()" style="margin-top:16px">🏆 Trilha Concluída! Ver resumo →</button>`:""}`;
}
</script>
